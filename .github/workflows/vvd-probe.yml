name: VVD Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: KVM availability
        run: |
          echo "== /dev/kvm =="; ls -l /dev/kvm || echo "NO /dev/kvm"
          echo "== virt flags =="; egrep -c '(vmx|svm)' /proc/cpuinfo || true
          sudo apt-get update -qq && sudo apt-get install -y -qq cpu-checker > /dev/null 2>&1 || true
          kvm-ok || true
      - name: Resources
        run: |
          df -h / | tail -1; free -h | head -2; nproc
