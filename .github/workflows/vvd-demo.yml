name: VVD Demo Capture
# Captures the C024 demo video: headless Vega Virtual Device on a GitHub
# Actions runner (/dev/kvm verified present), Xvfb + ffmpeg x11grab,
# scripted remote input via inputd-cli over vda. Manual trigger only.
#
# PREREQ: the Vega SDK 0.24.12112 tarball must exist as split release
# assets under the SDK release tag (see competitions/c024-amazon/
# SDK_DELIVERY_RUNBOOK.md). Until then this workflow fails fast at the
# "Fetch Vega SDK" step with the exact missing piece named.
on:
  workflow_dispatch:
    inputs:
      sdk_release_tag:
        description: "Release tag holding the vega-sdk part-* assets"
        required: false
        default: "vega-sdk-0.24.12112-noworkspace"

jobs:
  demo:
    runs-on: ubuntu-24.04
    # Worst case with the dispatch-#9 retry path: fetch ~4 + boot 30 +
    # choreography 45 (3 install attempts + raw fallback) + capture ~4.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: KVM gate (fail fast)
        run: |
          ls -l /dev/kvm || { echo "NO /dev/kvm on this runner"; exit 1; }
          # Standard GitHub-runner recipe: make /dev/kvm usable by the runner
          # user (the emulator hard-fails "x86_64 emulation currently requires
          # hardware acceleration!" without it; it never falls back to TCG).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          # /dev/kvm existing is not enough: prove the runner user can
          # actually use the KVM API, or the emulator boots degraded and
          # VDA can never connect ("ready" but invisible).
          python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); v=fcntl.ioctl(fd,0xAE00); print("KVM API version",v); assert v>=12'

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg xz-utils curl x11-utils xdotool > /dev/null 2>&1
          gh --version || true

      - name: Cache Vega SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/vega-sdk
          key: vega-sdk-${{ github.event.inputs.sdk_release_tag }}

      - name: Fetch Vega SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.sdk_release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "MISSING: release '$TAG' with vega-sdk part-* assets does not exist."; \
                 echo "Follow competitions/c024-amazon/SDK_DELIVERY_RUNBOOK.md, then re-dispatch."; exit 1; }
          mkdir -p /tmp/sdkdl "$HOME/vega-sdk"
          gh release download "$TAG" -p 'vega-sdk-part-*' -D /tmp/sdkdl
          cat /tmp/sdkdl/vega-sdk-part-* > /tmp/vega-sdk.tar.xz
          tar -xJf /tmp/vega-sdk.tar.xz -C "$HOME/vega-sdk"
          # Run 38621748159 died at boot: the tarball ships the PC's stale
          # vvd/instances/<uuid>/ state (hardware-qemu.ini, metadata) with
          # the PC install root /root/vega/sdk baked in. The Go
          # virtualdevice binary reuses that stale instance and fork/exec's
          # the emulator at the PC path; on the runner /root is not
          # traversable, so the launch dies with "permission denied" before
          # any device boots. Drop the stale instance state so
          # `virtual-device start` creates a fresh instance with
          # runner-local paths.
          rm -rf "$HOME/vega-sdk/0.24.12112/vvd/instances"
          # Run 38582760175 died at boot: the tarball lost the VVD
          # emulator's +x bit in transit ("Failed to launch:
          # fork/exec .../vvd/images/tv/vmtools/agent/emulator:
          # permission denied") while bin/ CLIs kept theirs. Restore
          # execute bits on the emulator and its qemu helpers after
          # extraction; without this the VVD can never boot.
          SDKROOT="$HOME/vega-sdk/0.24.12112"
          chmod +x "$SDKROOT/vvd/images/tv/vmtools/agent/emulator" 2>/dev/null || true
          find "$SDKROOT/vvd" -type f \( -name 'emulator*' -o -name 'qemu*' \) \
            -exec chmod +x {} + 2>/dev/null || true
          # The no-workspace SDK tarball ships no workspace/ tree at all, but
          # vega's import chain needs two things under it before vega
          # --version can run: (1) setup_packagelink_in_workspace symlinks
          # the repo into workspace/App, so the parent must exist; (2)
          # config.py's Dependencies init opens workspace/App/Config
          # (SKIP_LOCAL_CONFIG makes get_config_path return workspace/App
          # itself) and writes workspace/App/dependencies.pkl. The Config is
          # installer-shipped (vendored from the PC install as
          # demos/vega-workspace-App-Config); the tarball --exclude dropped
          # it along with the stale state (run 38466298288 died here).
          mkdir -p "$HOME/vega-sdk/0.24.12112/workspace/App"
          cp "$GITHUB_WORKSPACE/demos/vega-workspace-App-Config" \
             "$HOME/vega-sdk/0.24.12112/workspace/App/Config"
          # Run 38716808541 died at boot: the Boot step's background
          # `vega virtual-device start` and the first `vega device list`
          # poll race into config.py's create_symlink_farm (every vega
          # invocation rebuilds the farm at import); the loser's
          # exists-check-then-os.symlink dies with FileExistsError
          # (TOCTOU on the kepler-notices link), and a sibling interleave
          # can fake the "not pure symlink farm" exit(1). The patch script
          # converts every leaf create in config.py to create-first-then-
          # verify (EAFP); both racers build the identical farm, so the
          # race is harmless (verified: 10 threads x 30 iters, 0 crashes,
          # farms identical, single-process semantics preserved).
          # Runner-local only; the PC SDK and the release tarball are
          # untouched. Must run BEFORE the first vega invocation below.
          python3 "$GITHUB_WORKSPACE/demos/sdk_toctou_patch.py" \
            "$HOME/vega-sdk/0.24.12112/tools/bin/config.py"
          export PATH="$HOME/vega-sdk/0.24.12112/bin:$PATH"
          vega --version
          ls "$HOME/vega-sdk/0.24.12112/bin" | head
          # Restore +x on ALL ELF binaries and shebang scripts in the SDK
          # tree. The tarball transit can strip exec bits; when vvd creates
          # a fresh instance it shells out to helpers (qemu-img, mkscard,
          # vda, crashpad_handler) to build userdata.qcow2/cache.ext4, and a
          # missing +x there fails silently mid-boot.
          # NOTE (dispatch #8, 2026-10-16): -d '\n' is REQUIRED. The
          # no-workspace tarball ships filenames with spaces
          # (e.g. "... (dev).tmpl"); bare xargs splits them on whitespace,
          # chmod exits 123 on the phantom tokens, and set -e kills the
          # step before VVD ever boots. GNU xargs supports -d.
          find "$SDKROOT" -type f -exec file {} + 2>/dev/null | \
            grep -E 'ELF|executable|script' | cut -d: -f1 | xargs -r -d '\n' chmod +x
          # Make the REAL vda (SDK's KeplerCLIVegaDeviceAdaptor dispatcher ->
          # x86_64-Linux/bin/vda, the same binary vega uses) and vega visible
          # to every later step. $SDK/bin alone has no vda, so the old
          # choreography's bare `vda ...` was "command not found".
          VDA_DIR=$(dirname "$(ls "$SDKROOT"/packages/KeplerCLIVegaDeviceAdaptor/*/AL2_x86_64/DEV.STD.PTHREAD/build/bin/vda | head -1)")
          "$VDA_DIR/vda" version
          echo "$SDKROOT/bin" >> "$GITHUB_PATH"
          echo "$VDA_DIR" >> "$GITHUB_PATH"

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Boot VVD
        timeout-minutes: 30
        run: |
          SDK="$HOME/vega-sdk/0.24.12112"
          export DISPLAY=:99
          mkdir -p /tmp/vvd-logs
          # dutyfree-vega's config.py calls os.makedirs(workspace/env) with no
          # exist_ok: clear env defensively; KEEP workspace/App (Config +
          # dependencies.pkl + repo symlink), only drop stale broken symlinks.
          # (rm -rf on the whole App dir broke every vega command at import in
          # run 38397839099.)
          rm -rf "$SDK/workspace/env"
          find "$SDK/workspace/App" -maxdepth 1 -xtype l -delete 2>/dev/null || true
          mkdir -p "$SDK/workspace/App"
          cp "$GITHUB_WORKSPACE/demos/vega-workspace-App-Config" "$SDK/workspace/App/Config"

          # Helpers shared with later steps (sourced again there).
          cat > /tmp/vvd-lib.sh <<'LIB'
          ts()  { date -u +%H:%M:%S; }
          log() { printf '[%s] %s\n' "$(ts)" "$*" | tee -a /tmp/vvd-logs/boot-poll.log; }
          # Readiness = the SDK Go launcher's own checkShell contract
          # (`uname -a` says amazon AND hardware-name is vvrp), but every call
          # is time-boxed: vda/adb shell has no timeout of its own.
          vvd_probe() {
            local un hw
            un=$(timeout -k 5 20 vda -s "$1" shell uname -a 2>&1) || { log "  uname rc!=0: $un"; return 1; }
            hw=$(timeout -k 5 20 vda -s "$1" shell vdcm get com.amazon.devconf/system/device-info/hardware-name 2>&1) || { log "  vdcm rc!=0: $hw"; return 1; }
            log "  uname: $un | hw: $hw"
            printf '%s' "$un" | grep -qi amazon && printf '%s' "$hw" | grep -qi vvrp
          }
          # Host-side nested-virtualization modal (Qt dialog over the guest
          # window; present in EVERY run 21 screenshot, occluding the guest
          # in the capture). Pixel-guarded dismiss: the dialog body is light
          # gray at a fixed host position (guest window at 100,100); the
          # region (400,246)+60x12 is plain dialog background when the modal
          # is up and dark launcher/app UI when it is not. Mean luma > 150
          # = modal up. Best-effort only; never gates the run.
          modal_mean() {
            ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 \
              -vf "crop=60:12:400:246,format=gray" -frames:v 1 -f rawvideo /tmp/modal-probe.raw 2>/dev/null || { echo 0; return; }
            od -v -An -tu1 /tmp/modal-probe.raw 2>/dev/null | awk '{for(i=1;i<=NF;i++) s+=$i; n+=NF} END {if(n) print int(s/n); else print 0}'
          }
          dismiss_modal() {
            export DISPLAY=:99
            local m
            m=$(modal_mean); log "  modal probe: mean luma ${m}"
            if [ "${m:-0}" -gt 150 ]; then
              log "  nested-virt modal present; dismissing via xdotool"
              xdotool mousemove 390 237 click 1 2>/dev/null || true   # "Never show this again"
              sleep 1
              xdotool mousemove 768 274 click 1 2>/dev/null || true   # OK button
              sleep 2
              m=$(modal_mean)
              if [ "${m:-0}" -gt 150 ]; then log "  modal still present after click (continuing; cosmetic)"; else log "  modal dismissed"; fi
            else
              log "  nested-virt modal not present"
            fi
          }
          # Wall-clock deadline (not an iteration count); logs every poll.
          vvd_wait_ready() {
            local budget=$1 deadline=$(( $(date +%s) + $1 )) i=0 devs state
            while :; do
              i=$((i+1))
              devs=$(timeout -k 5 15 vda devices 2>&1) || true
              SERIAL=$(printf '%s\n' "$devs" | awk '$1 ~ /^emulator-[0-9]+$/ {print $1; exit}')
              state=$(printf '%s\n' "$devs" | awk '$1 ~ /^emulator-[0-9]+$/ {print $2; exit}')
              log "poll #$i: $(printf '%s' "$devs" | tail -n +2 | tr '\t\n' ' ;')"
              if [ -n "$SERIAL" ] && [ "$state" = device ] && vvd_probe "$SERIAL"; then
                log "READY $SERIAL (poll #$i)"; return 0
              fi
              if [ "$state" = offline ] && [ $((i % 6)) -eq 0 ]; then
                log "  offline for a while -> vda reconnect offline"
                timeout -k 5 15 vda reconnect offline > /dev/null 2>&1 || true
              fi
              [ "$state" = unauthorized ] && log "  unauthorized: ~/.android/adbkey.pub did not reach the guest"
              # The SDK launcher kills the emulator when its own budget expires.
              if grep -q 'LAUNCHER-EXIT' /tmp/vvd-start.log 2>/dev/null \
                 && ! grep -q 'Virtual device ready' /tmp/vvd-start.log; then
                log "launcher exited without 'Virtual device ready'"; return 1
              fi
              [ "$(date +%s)" -ge "$deadline" ] && { log "NOT READY after ${budget}s"; return 1; }
              sleep 10
            done
          }
          LIB
          . /tmp/vvd-lib.sh

          # 1) Sequential pre-launch: the first `vega device list` builds the
          #    symlink farm (`vega --version` exits before
          #    setup_runtime_environment and never built it), and one
          #    persistent vda server on tcp:5037 is started, generating
          #    ~/.android/adbkey BEFORE the emulator pushes adbkey.pub.
          timeout -k 5 180 vega device list > /tmp/vvd-logs/prelaunch-device-list.txt 2>&1 || true
          timeout -k 5 30 vda start-server 2>&1 | tee -a /tmp/vvd-logs/boot-poll.log || true
          ls -l ~/.android/ 2>&1 | tee -a /tmp/vvd-logs/boot-poll.log || true

          # 2) Launch. Keep the SDK's own boot budget (run 38722681803 fix);
          #    timestamp every line and record the exit (the Node wrapper
          #    swallows the Go launcher's status). Do NOT pass --vda-port=5037:
          #    --vda-port is the emulator's device-side port (5555, serial
          #    emulator-5554), not the vda server port, and the Node CLI does
          #    not forward it anyway.
          #    Do NOT pass --no-gl-accel: it maps to the emulator's -gpu off,
          #    which disables ALL guest rendering (runs 9+10: black guest
          #    screen, demo video would be a black rectangle). The runner has
          #    no GPU, so the AVD's own hw.gpu.mode=swiftshader_indirect
          #    (CPU rendering) is what we want; omitting the flag lets the
          #    emulator honor its config.
          ( vega virtual-device start --timeout 900 2>&1; echo "LAUNCHER-EXIT rc=$?" ) \
            | while IFS= read -r l || [ -n "$l" ]; do printf '%s %s\n' "$(date -u +%T)" "$l"; done > /tmp/vvd-start.log &

          # 3) Wait on vda directly (never `vega device list`: it runs an
          #    un-time-boxed per-device shell chain; run 7 froze inside it).
          if ! vvd_wait_ready 1080; then
            echo "VVD never became ready:"; cat /tmp/vvd-start.log; exit 1
          fi
          ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 /tmp/vvd-logs/shot-boot-ready.png || true

          # 4) Evidence for the run-7 question (never gates the job): one raw,
          #    time-boxed `vega device list`, plus each piece of its
          #    GET_DEVICE_INFO chain run separately with rc + duration.
          {
            echo "== vda devices -l"; timeout -k 5 15 vda devices -l
            echo "== raw vega device list"; s=$(date +%s)
            timeout -k 5 90 vega device list; echo "rc=$? after $(( $(date +%s) - s ))s"
            echo "== GET_DEVICE_INFO pieces"
            for c in "vdcm get com.amazon.devconf/system/device-info/device-type-id" "uname -m" \
                     "vdcm get com.amazon.devconf/system/device-info/profile" "uname -n" \
                     "vsm developer-mode" "vdcm get com.amazon.devconf/system/device-info/product-name" \
                     "vdcm get com.amazon.devconf/system/device-info/build-desc" "whoami"; do
              s=$(date +%s); o=$(timeout -k 5 30 vda -s "$SERIAL" shell "$c" 2>&1); r=$?
              echo "[$c] rc=$r $(( $(date +%s) - s ))s :: $o"
            done
          } > /tmp/vvd-logs/device-diag.txt 2>&1 || true

          # 5) inputd-cli button_press needs developer mode on VVD (default
          #    shell only exposes get_* commands); enabling it reboots the VVD.
          dm=$(timeout -k 5 30 vda -s "$SERIAL" shell vsm developer-mode 2>&1) || true
          log "developer-mode: $dm"
          if ! printf '%s' "$dm" | grep -q enable; then
            timeout -k 5 60 vda -s "$SERIAL" shell vsm developer-mode enable 2>&1 | tee -a /tmp/vvd-logs/boot-poll.log || true
            for _ in $(seq 1 18); do   # wait (<=3 min) for the reboot to drop the transport
              timeout -k 5 15 vda -s "$SERIAL" shell true > /dev/null 2>&1 || break
              sleep 10
            done
            vvd_wait_ready 600 || { echo "VVD did not come back after developer-mode enable"; exit 1; }
            sleep 20   # let the launcher/home UI settle after the reboot
          fi
          timeout -k 5 30 vda -s "$SERIAL" shell inputd-cli --help 2>&1 | tee /tmp/vvd-logs/inputd-help.txt || true
          grep -q button_press /tmp/vvd-logs/inputd-help.txt || { echo "inputd-cli button_press unavailable"; exit 1; }

          { echo "$SERIAL"; timeout -k 5 15 vda devices -l; } > /tmp/vvd-devices.txt 2>&1 || true
          echo "SERIAL=$SERIAL" >> "$GITHUB_ENV"

          # 6) DISPATCH #22 (queued since #18): dismiss the host-side
          #    nested-virtualization modal NOW, before ffmpeg capture starts,
          #    so it never occludes the guest in the demo video.
          dismiss_modal || true
          ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 /tmp/vvd-logs/shot-after-modal.png || true

      - name: Start ffmpeg capture
        run: |
          # Fragmented MP4 stays playable even if ffmpeg is killed; no cursor.
          nohup ffmpeg -y -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -movflags +frag_keyframe+empty_moov \
            /tmp/demo_take1.mp4 > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid
          sleep 2
          kill -0 "$(cat /tmp/ffmpeg.pid)" && echo "ffmpeg recording"

      - name: Install + launch app, scripted remote choreography
        # Dispatch #9 (run 38901912099, 2026-10-16): the boot readiness gate
        # (uname + hardware-name) passed on a partially-initialized guest
        # (black screen, nested-virtualization warning, flapping vdad
        # transport). `vega run-app` then died in its GET_DEVICE_INFO
        # discovery chain ("No permission for operation", exit 254) and the
        # transport went offline. The install phase now: (1) gates on a
        # settled guest, (2) retries 3x with transport recycle, (3) falls
        # back to raw vda primitives that bypass the Node CLI discovery.
        timeout-minutes: 45
        run: |
          . /tmp/vvd-lib.sh
          export DISPLAY=:99
          [ -n "${SERIAL:-}" ] || { echo "no SERIAL exported by Boot VVD"; exit 1; }
          echo "Using device id: $SERIAL"
          shot() { ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 "/tmp/vvd-logs/shot-$1.png" || true; }
          # Vega OS has no Android `input keyevent`; remote keys go through
          # inputd-cli with Linux key codes (KEY_ENTER = Select, KEY_DOWN,
          # KEY_PLAYPAUSE = the app's SupportedKeys.PlayPause toggle).
          # NOTE: KEY_BACK is deliberately NOT pressed. Verified in
          # PlayerScreen.vega.tsx: SupportedKeys.Back and hardwareBackPress
          # both route to navigateBack(), which destroys the video elements
          # and calls navigation.goBack(). Back does not dismiss the answer
          # card; it kills the player. The take ends on the answer card.
          key() {
            local out
            log "key $1"
            out=$(timeout -k 5 20 vda -s "$SERIAL" shell inputd-cli button_press "$1" 2>&1) || { log "  failed: $out"; return 1; }
            if printf '%s' "$out" | grep -qi 'did not match'; then log "  rejected: $out"; return 1; fi
          }

          # DISPATCH #22 safety net: if the nested-virt modal survived the
          # Boot-step dismiss (or reappeared), clear it before any keys.
          dismiss_modal || true

          # --- FIX #1 (dispatch #9 post-mortem, hardened run 11): gate the
          # install on a settled guest. Run 11 proved the transport flaps on
          # nested virt (vdad dropped exactly during probe 1, reconnected 1s
          # later), so each probe is tolerant: 5 tries, 10s apart, instead of
          # fail-fast. Then a non-black guest screen pixel check.
          tolerant_probe() {
            local t
            for t in 1 2 3 4 5; do
              timeout -k 5 30 vda -s "$SERIAL" shell true >/dev/null 2>&1 && return 0
              log "  probe try $t/5 failed; waiting for transport"
              sleep 10
            done
            return 1
          }
          preinstall_gate() {
            log "pre-install gate: 3 tolerant shell probes"
            local i
            for i in 1 2 3; do
              tolerant_probe || { log "  probe $i/3 FAILED after 5 tries"; return 1; }
              log "  probe $i/3 ok"
              if [ "$i" -lt 3 ]; then sleep 20; fi
            done
            shot preinstall-gate
            # Guest screen is the emulator window's child at 962x540+100+100
            # (run 10 x11-tree.txt). A black guest crops to ~20KB PNG; a
            # rendered TV UI is far larger. (ffmpeg signalstats prints no
            # per-frame stats on modern ffmpeg, so no text parsing; PNG byte
            # size of the guest-region crop is the signal.)
            local crop_bytes
            ffmpeg -loglevel error -y -i /tmp/vvd-logs/shot-preinstall-gate.png \
              -vf "crop=962:540:100:100" -frames:v 1 /tmp/vvd-logs/guest-crop.png \
              || { log "  guest crop failed"; return 1; }
            crop_bytes=$(wc -c < /tmp/vvd-logs/guest-crop.png | tr -d ' ')
            log "  guest-region crop PNG bytes=$crop_bytes"
            [ "$crop_bytes" -gt 60000 ] \
              || { log "  SCREEN IS BLACK: guest UI never rendered"; return 1; }
            log "pre-install gate PASSED"
          }

          # --- FIX #2 (dispatch #9 post-mortem): 3 install attempts with
          # backoff; recycle the vda transport between attempts (in #9 the
          # transport went offline after the failed install and never came
          # back on its own).
          try_install_cli() {
            timeout -k 10 300 vega run-app "$GITHUB_WORKSPACE/demos/vega_x86_64.vpkg" \
              com.saxenawave.kidsdevotion.main --deviceId "$SERIAL"
          }
          recycle_vda() {
            log "recycling vda transport"
            vda kill-server >/dev/null 2>&1 || true
            sleep 5
            timeout -k 5 30 vda start-server >/dev/null 2>&1 || true
            sleep 10
          }
          # Run 11: with software rendering the guest needs a minute for the
          # boot animation/UI to settle before the gate probes it.
          log "settle 45s for software-rendered boot"
          sleep 45
          preinstall_gate || { echo "PRE-INSTALL GATE FAILED: guest never settled (see shot-preinstall-gate.png in the logs artifact)"; exit 1; }
          install_ok=0
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            log "== install attempt $attempt/3 (Node CLI path)"
            rc=0
            try_install_cli || rc=$?
            if [ "$rc" -eq 0 ]; then log "install SUCCEEDED via Node CLI"; install_ok=1; break; fi
            log "install attempt $attempt FAILED (rc=$rc)"
            recycle_vda
            vvd_wait_ready 300 || { echo "device did not come back after transport recycle"; exit 1; }
            preinstall_gate || { echo "pre-install gate failed on retry $attempt"; exit 1; }
            sleep 10
          done

          # --- FIX #3 (dispatch #9 post-mortem): if the Node CLI path fails
          # all 3 attempts, bypass its GET_DEVICE_INFO discovery chain (the
          # exit-254 "No permission for operation" failure in #9) with raw
          # vda primitives: push + guest-side vpm install, then launch via
          # vmsgr (primitives from the merged 5-model review).
          if [ "$install_ok" -ne 1 ]; then
            log "Node CLI path failed 3x; trying RAW fallback"
            timeout -k 10 300 vda -s "$SERIAL" push "$GITHUB_WORKSPACE/demos/vega_x86_64.vpkg" /data/local/tmp/take1.vpkg \
              || { echo "raw fallback: vda push failed"; exit 1; }
            log "push ok; guest vpm install"
            timeout -k 5 300 vda -s "$SERIAL" shell vpm install /data/local/tmp/take1.vpkg \
              || { echo "raw fallback: vpm install failed"; exit 1; }
            log "vpm install ok; launching via vmsgr"
            timeout -k 5 60 vda -s "$SERIAL" shell vmsgr send pkg://com.saxenawave.kidsdevotion.main \
              || { echo "raw fallback: vmsgr launch failed"; exit 1; }
            log "RAW FALLBACK install+launch SUCCEEDED"
          fi

          # --- DISPATCH #27 (boss decision 2026-10-20: hunt the app-side
          # post-answer exit in the app, not the edit): DIAGNOSTIC ONLY.
          # Runs 25+26 proved the app exits Player->Details ~0.5s after
          # the answer card renders, on BOTH input paths (inputd ENTER
          # and host-side remote-OK click), with the navigateBack
          # signature (video elements destroyed, goBack ~300ms later).
          # Static hunt closed the caller set in PlayerScreen.vega.tsx:
          # navigateBack is reachable ONLY from (a) the Back key case,
          # (b) BackHandler hardwareBackPress, (c) the isVideoEnded
          # effect (VideoHandler.onEnded, W3C 'ended'), (d) the Exit
          # chip onSelect. Every path console.logs with a distinct tag
          # ('[Kepler] Key pressed: Back', '[VideoHandler] - onEnded',
          # '[PlayerScreen.kepler] - Navigating back', '- Cleaning up
          # video handler'), but NO guest/app log has ever been captured
          # (diagnostics only collected host + CLI logs). Start live
          # guest-log tails NOW (background, ffmpeg pattern, self-
          # terminating) so the answer moment is captured whichever
          # logger the guest actually uses; post-hoc dumps are added in
          # Collect diagnostics as the ring-buffer fallback. The
          # choreography below is byte-identical to run 26.
          log "dispatch #27: starting guest log tails (diagnostic)"
          # DISPATCH #28: run 27's journalctl attempt was intercepted by
          # the Vega developer shell: "journalctl is not supported in
          # developer mode shell. Please use loggingctl instead."
          # loggingctl log is the platform tool (supports -f follow,
          # -o short_precise, and -v <package> filtering). logcat does
          # not exist on Vega. Use loggingctl, package-filtered.
          timeout -k 5 1500 vda -s "$SERIAL" shell loggingctl log -f -o short_precise -v com.saxenawave.kidsdevotion \
            > /tmp/vvd-logs/guest-applog-live.log 2>&1 &
          timeout -k 5 1500 vda -s "$SERIAL" shell logcat -v time \
            > /tmp/vvd-logs/guest-logcat-live.log 2>&1 &
          log "guest clock at tail start: $(timeout -k 5 15 vda -s "$SERIAL" shell date 2>/dev/null || echo unavailable)"

          # --- FOREGROUND GATE (run 38956789191 post-mortem): vega run-app
          # can install the app without ever bringing it to the foreground.
          # In run 15 the Fire TV launcher profile drawer ("Pioneer Tom")
          # held focus OVER the app detail screen, so the whole key
          # sequence navigated the drawer while the run reported
          # CHOREOGRAPHY-DONE. Explicitly foreground the app and verify
          # focus before the first nav key; fail loudly instead of
          # navigating the launcher blind.
          APP_PKG="com.saxenawave.kidsdevotion.main"
          # Real package name (vlcm --pkg-id). APP_PKG above is the activity
          # ROUTE used in pkg:// URLs; a process runs under PKG_ID only.
          PKG_ID="com.saxenawave.kidsdevotion"
          LAST_LAUNCH=0
          DRAWER_SEEN=0
          fg_launch() {
            # DISPATCH #22 FIX 1 (run 39305036379 post-mortem): mirror the
            # proven Node CLI launch pair. The ONLY successful app start in
            # run 21 came from `vega run-app`, whose own log shows it runs
            # `vlcm terminate-app --force --pkg-id com.saxenawave.kidsdevotion`
            # FIRST and then `vmsgr send pkg://...main`. The gate's two raw
            # vmsgr sends returned host rc 0 but produced NO guest process.
            # Terminate first, then send, and capture both commands'
            # guest-side output in the log so "rc 0, no process" can never
            # be a mystery again.
            local tout sout
            tout=$(timeout -k 5 60 vda -s "$SERIAL" shell vlcm terminate-app --force --pkg-id "$PKG_ID" 2>&1) || true
            log "  terminate-app $PKG_ID: ${tout:-<no output>}"
            if ! sout=$(timeout -k 5 60 vda -s "$SERIAL" shell vmsgr send "pkg://$APP_PKG" 2>&1); then
              echo "foreground launch failed: $sout"; exit 1
            fi
            log "  vmsgr send pkg://$APP_PKG: ${sout:-<no output>}"
            LAST_LAUNCH=$(date +%s)
          }
          settle45() {
            # DISPATCH #22 FIX 2: 45s post-launch settle before any
            # process/focus verdict (SwiftShader cold start is slow; run 21
            # probed at 15s/35s post-send and the too-short-wait doubt was
            # never fully closed). Waits only the REMAINDER of 45s since
            # the last fg_launch, so paths that already waited don't stall.
            local elapsed wait_s
            [ "$LAST_LAUNCH" -gt 0 ] || return 0
            elapsed=$(( $(date +%s) - LAST_LAUNCH ))
            if [ "$elapsed" -lt 45 ]; then
              wait_s=$((45 - elapsed))
              log "  settle: waiting ${wait_s}s more (45s post-launch)"
              sleep "$wait_s"
            fi
          }
          proc_diag() {
            # DISPATCH #23 FIX 1 (run 39454924754 post-mortem): the process
            # probes are DEMOTED to non-gating diagnostics. Run 22 proved
            # pidof/ps return NOTHING while the app is visibly running in
            # three consecutive screenshots and in the MP4's final frame:
            # Vega/Kepler apps are runtime-hosted and the guest ps does not
            # expose them under the package id. The probe was never
            # positive-controlled on this guest, so it must never gate
            # again. Dump the full process tables ONCE, here, while the app
            # is up, to learn the real runtime process name for future
            # runs. Informational only; can never fail the gate.
            log "  process diagnostics (NON-GATING): dumping ps / ps -A / pidof to boot-poll.log"
            {
              echo "== pidof $PKG_ID"; timeout -k 5 20 vda -s "$SERIAL" shell pidof "$PKG_ID" 2>&1
              echo "== pidof $APP_PKG"; timeout -k 5 20 vda -s "$SERIAL" shell pidof "$APP_PKG" 2>&1
              echo "== ps"; timeout -k 5 20 vda -s "$SERIAL" shell ps 2>&1
              echo "== ps -A"; timeout -k 5 20 vda -s "$SERIAL" shell ps -A 2>&1
              echo "== ps -ef"; timeout -k 5 20 vda -s "$SERIAL" shell ps -ef 2>&1
            } >> /tmp/vvd-logs/boot-poll.log 2>&1 || true
          }
          guest_luma() {  # $1 = screenshot path; prints mean luma of guest region
            ffmpeg -loglevel error -y -i "$1" -vf "crop=962:540:100:100,format=gray" \
              -frames:v 1 -f rawvideo /tmp/fg-gray.raw 2>/dev/null || { echo 0; return; }
            od -v -An -tu1 /tmp/fg-gray.raw 2>/dev/null \
              | awk '{for(i=1;i<=NF;i++) s+=$i; n+=NF} END {if(n) printf "%d", s/n; else print 0}'
          }
          visual_verdict() {  # $1 = screenshot path; prints ONE word: app|drawer|black|grid
            # DISPATCH #23 FIX 2: the foreground gate is a VISUAL verdict,
            # replacing the false-negative process probe. Thresholds were
            # unit-tested offline against the run-22 artifact set:
            # drawer_match fires on every drawer shot (0-1637 of 360000
            # bytes) and never on clean app home (237519) or the grid
            # (240959); every real content frame has guest-region mean
            # luma >= 9.1 while pure black is ~0; the clean app home
            # differs from the post-BACK grid shot in 86% of guest-region
            # bytes while the grid differs from itself by 0%.
            # Diagnostics go to stderr / the log file ONLY: stdout carries
            # the verdict word alone (callers capture it).
            if drawer_match "$1" >/dev/null; then echo drawer; return; fi
            local luma
            luma=$(guest_luma "$1")
            echo "  visual verdict: guest luma ${luma}" >&2
            if [ "${luma:-0}" -lt 3 ]; then echo black; return; fi
            if [ -f /tmp/vvd-logs/shot-foreground-1c.png ]; then
              # shot-foreground-1c is the post-BACK "Your apps" grid. If
              # the current screen is still (near-)identical to it, the
              # app never came up: we are sitting on the launcher grid.
              ffmpeg -loglevel error -y -i "$1" -vf "crop=962:540:100:100,format=rgb24" \
                -f rawvideo /tmp/fg-vcur.raw 2>/dev/null || { echo app; return; }
              ffmpeg -loglevel error -y -i /tmp/vvd-logs/shot-foreground-1c.png \
                -vf "crop=962:540:100:100,format=rgb24" -f rawvideo /tmp/fg-vgrid.raw 2>/dev/null || { echo app; return; }
              local total diffb pct
              total=$(stat -c%s /tmp/fg-vgrid.raw)
              [ "${total:-0}" -gt 0 ] || { echo app; return; }
              diffb=$(cmp -l /tmp/fg-vcur.raw /tmp/fg-vgrid.raw | wc -l)
              pct=$(( diffb * 100 / total ))
              echo "  visual verdict: grid diff ${diffb}/${total} bytes (${pct}%)" >&2
              if [ "$pct" -lt 5 ]; then echo grid; return; fi
            fi
            echo app
          }
          drawer_finisher() {  # $1 = suffix for the post-finisher screenshot
            # DISPATCH #23 FIX 3 (run 22 evidence): with the app already
            # up and the launcher nav drawer over it, UP UP LEFT LEFT
            # ENTER clears the drawer and leaves the app home with the
            # first card focused (run 22 shot-grid-launched + MP4 end
            # frame). STRICTLY conditional: callers fire this ONLY when
            # visual_verdict said "drawer". With the app up and NO drawer,
            # the same ENTER would hit the focused first card, open
            # Details early, and corrupt the choreography.
            log "  drawer finisher: UP UP LEFT LEFT ENTER (drawer visible)"
            key "KEY_UP" || true; key "KEY_UP" || true
            key "KEY_LEFT" || true; key "KEY_LEFT" || true
            sleep 2; shot "foreground-$1-focus"
            key "KEY_ENTER" || true
            LAST_LAUNCH=$(date +%s)
            settle45; shot "foreground-$1"
          }
          focus_probe() {  # prints focused window line; empty if dumpsys unavailable
            timeout -k 5 20 vda -s "$SERIAL" shell dumpsys window windows 2>/dev/null \
              | grep -i -m1 "mCurrentFocus\|mFocusedApp" || true
          }
          drawer_match() {  # $1 = screenshot path; rc 0 = launcher drawer visible
            # The #15 drawer has a stable signature: dark panel + white Home
            # pill on the left edge (demos/launcher-drawer-ref.png, 200x600
            # crop from run 38956789191 shot-home.png). Byte-diff the same
            # crop: self-diff 0, drawer-vs-app-content 75%; 20% threshold
            # tolerates a moved focus pill while staying far from app UI.
            ffmpeg -loglevel error -y -i "$1" -vf "crop=200:600:60:120,format=rgb24" \
              -f rawvideo /tmp/fg-cur.raw || return 2
            ffmpeg -loglevel error -y -i "$GITHUB_WORKSPACE/demos/launcher-drawer-ref.png" \
              -vf "format=rgb24" -f rawvideo /tmp/fg-ref.raw || return 2
            total=$(stat -c%s /tmp/fg-ref.raw)
            diffbytes=$(cmp -l /tmp/fg-cur.raw /tmp/fg-ref.raw | wc -l)
            log "  drawer pixel check: $diffbytes/$total bytes differ"
            [ "$diffbytes" -lt $((total / 5)) ]
          }
          log "foreground gate: explicit app launch + focus verify"
          fg_launch; sleep 15; shot foreground-1
          FOCUS="$(focus_probe)"; log "  focus probe: ${FOCUS:-<dumpsys empty>}"
          fg_verified=0
          case "$FOCUS" in
            *"$PKG_ID"*) fg_verified=1 ;;
          esac
          if [ "$fg_verified" -ne 1 ] && [ -n "$FOCUS" ]; then
            log "  focus not on app; one explicit relaunch, then re-probe"
            fg_launch; sleep 15; shot foreground-2
            FOCUS="$(focus_probe)"; log "  focus re-probe: ${FOCUS:-<dumpsys empty>}"
            case "$FOCUS" in
              *"$PKG_ID"*) fg_verified=1 ;;
            esac
            if [ "$fg_verified" -ne 1 ]; then
              echo "FOREGROUND GATE FAILED: focus is '${FOCUS}', not ${APP_PKG}; refusing to navigate the launcher blind"; exit 1
            fi
          fi
          if [ "$fg_verified" -ne 1 ]; then
            # dumpsys unavailable: fall back to the drawer pixel signature.
            # Dispatch 18 fix: the launcher profile drawer persists after
            # BACK/ENTER. Use KEY_HOME to reset to launcher home (clears
            # any drawer), then relaunch the app via vmsgr.
            if drawer_match /tmp/vvd-logs/shot-foreground-1.png; then
              DRAWER_SEEN=1
              log "  drawer visible after launch; HOME + relaunch"
              key "KEY_HOME" || true
              sleep 10; shot foreground-home
              fg_launch; sleep 15; shot foreground-1b
              if drawer_match /tmp/vvd-logs/shot-foreground-1b.png; then
                log "  drawer still visible after HOME+relaunch; trying BACK"
                key "KEY_BACK" || true
                sleep 10; shot foreground-1c
                if drawer_match /tmp/vvd-logs/shot-foreground-1c.png; then
                  echo "FOREGROUND GATE FAILED: launcher profile drawer persists after HOME+relaunch+BACK; refusing to navigate blind"; exit 1
                fi
                # DISPATCH #20 POST-MORTEM (run 39212821104): KEY_HOME
                # backgrounded the app, and the vmsgr relaunch above fired
                # while the drawer was still up (intent may not have taken
                # effect). After KEY_BACK clears the drawer, the app's
                # foreground status is UNKNOWN. Run 20 proceeded here and
                # choreography died: ENTER pressed twice, screen never
                # changed, "never reached Details". Do a final explicit
                # launch NOW that the drawer is gone, and verify the app
                # process is alive before proceeding.
                log "  drawer cleared via BACK; final relaunch to restore foreground"
                fg_launch; settle45; shot foreground-final
              fi
              log "  drawer cleared; proceeding"
            fi
            # DISPATCH #23 (run 39454924754 post-mortem): the gate is a
            # VISUAL verdict now. Run 22's gate failed on a FALSE-NEGATIVE
            # process probe (pidof/ps empty while the app was visibly
            # running), so the probes are diagnostics only (proc_diag) and
            # never gate. Ladder: settle, shoot, judge. "drawer" -> the
            # proven finisher (fix 3, strictly drawer-conditional). Any
            # remaining non-"app" verdict -> one emergency terminate+send
            # relaunch and re-judge (finisher again if the drawer
            # reappeared over the relaunched app). Fail ONLY when the
            # final verdict is not "app": drawer persisting after the
            # full ladder, or a black/launcher screen. Choreography is
            # screen-change-verified downstream, so a visual "app" here
            # restores the gate's real purpose: never navigate blind.
            proc_diag
            settle45; shot foreground-verdict
            FGV=$(visual_verdict /tmp/vvd-logs/shot-foreground-verdict.png)
            log "  foreground visual verdict: $FGV"
            if [ "$FGV" = "drawer" ]; then
              drawer_finisher finisher1
              FGV=$(visual_verdict /tmp/vvd-logs/shot-foreground-finisher1.png)
              log "  verdict after drawer finisher: $FGV"
            fi
            if [ "$FGV" != "app" ]; then
              log "  verdict '$FGV': emergency relaunch (terminate+send pair), then re-judge"
              fg_launch; settle45; shot foreground-verdict2
              FGV=$(visual_verdict /tmp/vvd-logs/shot-foreground-verdict2.png)
              log "  verdict after emergency relaunch: $FGV"
              if [ "$FGV" = "drawer" ]; then
                drawer_finisher finisher2
                FGV=$(visual_verdict /tmp/vvd-logs/shot-foreground-finisher2.png)
                log "  verdict after second drawer finisher: $FGV"
              fi
            fi
            if [ "$FGV" != "app" ]; then
              echo "FOREGROUND GATE FAILED (visual): final verdict '$FGV' after the full ladder (terminate+send launches, drawer finisher, emergency relaunch); refusing to navigate blind"; exit 1
            fi
            log "foreground gate PASSED (visual): app foregrounded, no drawer, contentful screen"
          else
            log "  foreground gate PASSED: ${APP_PKG} has focus"
          fi

          # Run 12: the app takes 30s+ to paint after install; the key
          # sequence started while it was still loading, so the Pause & Ask
          # moment never landed on camera. Give it a full minute, then
          # confirm the guest is actually showing something before keys.
          # Run 14: blind keys are unreliable on nested virt (the app is
          # slow; a key can land before the screen settles). After each
          # navigation key, wait up to 30s for the screenshot to actually
          # change; if it never changes, try the key once more before
          # giving up on the step.
          key_wait_change() {  # $1=key $2=shot-name $3=prev-shot-path
            key "$1" || return 1
            local i
            for i in 1 2 3 4 5 6; do
              sleep 5
              shot "$2"
              if ! cmp -s "/tmp/vvd-logs/shot-$2.png" "$3"; then
                log "  screen changed after $1 (waited $((i*5))s)"
                return 0
              fi
            done
            log "  screen did NOT change after $1 (30s)"
            return 1
          }
          log "settle 60s for app first paint"
          sleep 60; shot app-settled
          sleep 12; shot home      # Home: drawer open, first card row visible
          # Home -> Details: ENTER (if the drawer stole focus, this closes
          # it; retry once if the screen never changes).
          key_wait_change KEY_ENTER detail /tmp/vvd-logs/shot-home.png \
            || key_wait_change KEY_ENTER detail-retry /tmp/vvd-logs/shot-detail.png \
            || { echo "never reached Details"; exit 1; }
          # Details -> Player: Watch now has DefaultFocus.
          key_wait_change KEY_ENTER player /tmp/vvd-logs/shot-detail.png \
            || key_wait_change KEY_ENTER player-retry /tmp/vvd-logs/shot-player.png \
            || { echo "never reached Player"; exit 1; }
          # --- DISPATCH #24 (run 39457301151 post-mortem): the pause
          # never landed in run 23. PLAYPAUSE fired ~1-6s after the
          # Player screen appeared, while the player was still
          # initializing / buffering the streamed MP4, so the toggle
          # was swallowed and shot-paused/shot-answer/shot-final all
          # show the video playing bare. The app is NOT at fault:
          # PlayerScreen.vega.tsx renders PauseAndAsk whenever paused,
          # and scene 1 (video 0-120s) has authored questions. So:
          # never pause on a blind timer again. (1) Confirm playback
          # by MOTION (shot pairs 4s apart, video region must change;
          # ~90s poll covers stream buffering). (2) Pause at ~10-15s
          # of CONFIRMED playback, deep inside scene 1. (3) Verify the
          # pause FROZE the frame (pair ~2s apart identical in the
          # video region) AND the paused frame differs from the
          # playing frames (PauseAndAsk overlay); retry PLAYPAUSE up
          # to 3 times, re-checking state before each press so a good
          # pause is never resumed by a blind re-press. (4) Only a
          # verified pause unlocks DOWN/ENTER, and the answer card
          # must visibly change the screen before CHOREOGRAPHY-DONE.
          region_diff_pct() {  # $1=shotA $2=shotB; prints % of differing bytes in the guest/video region; 100 on error
            ffmpeg -loglevel error -y -i "$1" -vf "crop=962:540:100:100,format=rgb24" \
              -f rawvideo /tmp/pd-a.raw 2>/dev/null || { echo 100; return; }
            ffmpeg -loglevel error -y -i "$2" -vf "crop=962:540:100:100,format=rgb24" \
              -f rawvideo /tmp/pd-b.raw 2>/dev/null || { echo 100; return; }
            local total diffb
            total=$(stat -c%s /tmp/pd-a.raw)
            [ "${total:-0}" -gt 0 ] || { echo 100; return; }
            diffb=$(cmp -l /tmp/pd-a.raw /tmp/pd-b.raw | wc -l)
            echo $(( diffb * 100 / total ))
          }
          log "pause sequence: waiting for CONFIRMED playback (motion in video region)"
          shot play-a
          PLAYING=0
          for i in $(seq 1 22); do
            sleep 4; shot play-b
            if [ -f /tmp/vvd-logs/shot-play-a.png ] && [ -f /tmp/vvd-logs/shot-play-b.png ]; then
              PD=$(region_diff_pct /tmp/vvd-logs/shot-play-a.png /tmp/vvd-logs/shot-play-b.png)
            else
              PD=0
            fi
            log "  playback poll $i: video-region diff ${PD}% (want >=4 = motion)"
            if [ "${PD:-0}" -ge 4 ]; then PLAYING=1; break; fi
            mv /tmp/vvd-logs/shot-play-b.png /tmp/vvd-logs/shot-play-a.png
          done
          if [ "$PLAYING" -ne 1 ]; then
            echo "PAUSE SEQUENCE FAILED: playback never confirmed (no motion in video region after ~90s of polling); refusing to pause blind"; exit 1
          fi
          log "playback CONFIRMED (motion in video region); letting it play ~12s before pausing"
          sleep 12; shot playing
          # --- DISPATCH #25 (run 39459731702 post-mortem): the #24 gate
          # machinery is PROVEN (it correctly refused a pause that never
          # happened), but the ACTUATOR is wrong: inputd-cli KEY_PLAYPAUSE
          # is accepted by inputd yet never pauses - 3 presses at ~15/23/
          # 30s of CONFIRMED playback, and the MP4 never froze for one
          # sampled interval. App source is correct (PlayPause ->
          # togglePausePlay; PauseAndAsk renders when paused; the kepler
          # RemoteControlManager maps HWEvent 'playpause' -> PlayPause),
          # so the break is media-key delivery/routing inside the
          # emulator (media-session intercept, double-toggle, or a guest
          # event other than 'playpause'). #25 changes ONLY the
          # actuator. The #24 verified-pause gate (frozen pair <=2% AND
          # vs-playing panel diff >=3%) remains the sole arbiter, and
          # state is re-checked before EVERY attempt, so a pause that
          # already took is never undone by a blind toggle re-press.
          # Actuator ladder:
          #   A) OVERLAY PAUSE BUTTON (primary): KEY_UP is in the kepler
          #      key mapping but has no case in PlayerScreen's switch,
          #      so it hits the default branch -> showControls(). The
          #      VideoOverlay's Pause FocusablePressable carries
          #      DefaultFocus and its onSelect IS togglePausePlay. The
          #      overlay scrim (rgba(0,0,0,0.5), full-screen) drops the
          #      guest mean luma hard, so a luma probe confirms the
          #      overlay is up before ENTER is pressed.
          #   B) HOST-SIDE REMOTE CLICK: xdotool-click the VVD window's
          #      on-screen remote play/pause button (host 1180,410;
          #      center measured on run-24 screenshots) - the virtual
          #      remote's genuine input path; same host-side technique
          #      as the proven nested-virt modal dismiss.
          #   C) ALTERNATE KEY PROBES (gate-arbitrated, in order):
          #      KEY_PLAY, KEY_PAUSE, KEY_MEDIA_PLAY_PAUSE, and a
          #      long-press KEY_PLAYPAUSE (inputd-cli button_press
          #      accepts a `long` modifier).
          # Time discipline: PauseAndAsk renders NOTHING outside the
          # authored question windows (scene 1 = video 0-120s), so the
          # ladder is lean (A x2, B x2, C x4, each ~8-10s): worst case
          # the verified pause lands by ~85s of video time.
          PAUSED=0; WINNER=""
          pause_check() {  # $1=tag; rc 0 = VERIFIED pause (saves shot-paused)
            shot "pausechk-$1-a"; sleep 2; shot "pausechk-$1-b"
            FROZEN=$(region_diff_pct "/tmp/vvd-logs/shot-pausechk-$1-a.png" "/tmp/vvd-logs/shot-pausechk-$1-b.png")
            PANEL=$(region_diff_pct /tmp/vvd-logs/shot-playing.png "/tmp/vvd-logs/shot-pausechk-$1-b.png")
            log "  pause check [$1]: frozen diff ${FROZEN}% (want <=2), vs-playing diff ${PANEL}% (want >=3 = PauseAndAsk overlay)"
            if [ "${FROZEN:-100}" -le 2 ] && [ "${PANEL:-0}" -ge 3 ]; then
              cp "/tmp/vvd-logs/shot-pausechk-$1-b.png" /tmp/vvd-logs/shot-paused.png
              return 0
            fi
            return 1
          }
          key_long() {  # $1=key; inputd-cli long-press variant
            local out
            log "key $1 (long press)"
            out=$(timeout -k 5 20 vda -s "$SERIAL" shell inputd-cli button_press "$1" long 2>&1) || { log "  failed: $out"; return 1; }
            if printf '%s' "$out" | grep -qi 'did not match'; then log "  rejected: $out"; return 1; fi
          }
          # --- Actuator A: overlay Pause button (showControls + ENTER)
          log "actuator A: KEY_UP -> showControls, luma-probe the overlay, ENTER on the DefaultFocus Pause button"
          for atry in 1 2; do
            if [ "$PAUSED" -eq 1 ]; then break; fi
            if [ "$atry" -gt 1 ]; then
              # State re-check before a second ENTER: a late-landing
              # toggle from attempt 1 must never be undone by a re-press.
              if pause_check "a$atry-pre"; then PAUSED=1; WINNER="overlay Pause button (late landing)"; break; fi
            fi
            shot overlay-base
            BASE_LUMA=$(guest_luma /tmp/vvd-logs/shot-overlay-base.png)
            key KEY_UP || true
            sleep 2; shot "overlay-probe$atry"
            PROBE_LUMA=$(guest_luma "/tmp/vvd-logs/shot-overlay-probe$atry.png")
            log "  overlay probe $atry: guest luma base=${BASE_LUMA} probe=${PROBE_LUMA} (overlay scrim confirmed if probe <= 78% of base)"
            if [ "${BASE_LUMA:-0}" -gt 10 ] && [ "${PROBE_LUMA:-0}" -gt 0 ] && [ "${PROBE_LUMA:-999999}" -le $(( ${BASE_LUMA:-0} * 78 / 100 )) ]; then
              log "  overlay CONFIRMED (scrim luma drop); ENTER on the focused Pause button"
              key KEY_ENTER || true
              sleep 1
              if pause_check "a$atry"; then PAUSED=1; WINNER="overlay Pause button (KEY_UP showControls + ENTER)"; fi
            else
              log "  overlay NOT confirmed by luma probe; ENTER withheld (would be blind)"
            fi
          done
          # --- Actuator B: host-side click on the VVD on-screen remote
          if [ "$PAUSED" -ne 1 ]; then
            log "actuator B: xdotool click on the VVD on-screen remote play/pause button (host 1180,410)"
            for btry in 1 2; do
              if [ "$PAUSED" -eq 1 ]; then break; fi
              if [ "$btry" -gt 1 ]; then
                if pause_check "b$btry-pre"; then PAUSED=1; WINNER="remote click (late landing)"; break; fi
              fi
              xdotool mousemove 1180 410 click 1 2>/dev/null || true
              log "  remote play/pause clicked (try $btry); settle 2s"
              sleep 2; shot "remote-probe$btry"
              if pause_check "b$btry"; then PAUSED=1; WINNER="VVD remote play/pause click (xdotool)"; fi
            done
          fi
          # --- Actuator C: alternate inputd keys (gate-arbitrated)
          if [ "$PAUSED" -ne 1 ]; then
            log "actuator C: alternate key probes KEY_PLAY / KEY_PAUSE / KEY_MEDIA_PLAY_PAUSE / long-press KEY_PLAYPAUSE"
            for ckey in KEY_PLAY KEY_PAUSE KEY_MEDIA_PLAY_PAUSE; do
              if [ "$PAUSED" -eq 1 ]; then break; fi
              key "$ckey" || true
              log "  probe $ckey sent; settle 3s"
              sleep 3
              if pause_check "c-$ckey"; then PAUSED=1; WINNER="inputd $ckey"; fi
            done
            if [ "$PAUSED" -ne 1 ]; then
              key_long KEY_PLAYPAUSE || true
              log "  probe long-press KEY_PLAYPAUSE sent; settle 3s"
              sleep 3
              if pause_check "c-longplaypause"; then PAUSED=1; WINNER="inputd long-press KEY_PLAYPAUSE"; fi
            fi
          fi
          if [ "$PAUSED" -ne 1 ]; then
            echo "PAUSE SEQUENCE FAILED: no actuator (overlay button / remote click / alternate keys) produced a verified frozen frame"; exit 1
          fi
          log "pause VERIFIED via $WINNER: frame frozen + Pause & Ask overlay present; shot-paused saved"
          # --- DISPATCH #26 (run 39462478099 post-mortem): the full
          # flow IS on camera, but the take does not END on the answer
          # card: ~0.5-1s after the card renders, the app exits the
          # player to Details (navigateBack signature), so the old
          # shot-answer (ENTER + 10s) photographed Details and the #24
          # check false-positived (98% diff = navigation, not card
          # presence). Three changes; everything else untouched:
          #  (1) STRENGTHENED ANSWER CHECK (answer_ok): the candidate
          #      must (a) differ from shot-paused by >=2% (something
          #      opened) AND (b) differ from this run's shot-detail by
          #      >=6% (it is NOT the Details screen). Offline
          #      calibration on run-25 artifacts, guest-region diffs:
          #      card D1=97/D2=15 PASS; Details D1=98/D2=0 FAIL;
          #      pure-black mid-exit frame D1=99/D2=4 FAIL; unchanged
          #      paused D1=0 FAIL. A controls-strip resemblance test
          #      was designed and REJECTED by the same calibration:
          #      in the card state the video surface behind the panel
          #      is black, so every paused-resemblance byte test reads
          #      ~95% and would fail the true card. D2 is the
          #      Details-killer: Details is pixel-static (0% across
          #      8 minutes in run 25), so any candidate that IS the
          #      Details screen scores ~0 against shot-detail.
          #  (2) DWELL SHOTS: the card's on-screen life can be ~1s,
          #      so photograph at ~+1s/+2s/+3s after the ENTER; the
          #      first dwell shot passing answer_ok is saved as the
          #      real shot-answer, caught while the card is up.
          #  (3) SINGLE-DELIVERY ENTER: the primary answer ENTER is a
          #      host-side xdotool click on the VVD remote's OK button
          #      (1156,282; grounding-verified center on run-25
          #      frames) - the virtual remote's genuine input path.
          #      Lead suspect for the exit is the inputd ENTER being
          #      delivered twice via FocusablePressable's dual
          #      onSelect/onPress wiring; the remote click delivers
          #      exactly once. If the click yields no verified card,
          #      fall back to the inputd KEY_ENTER path, also
          #      dwell-shot and triple-checked.
          answer_ok() {  # $1=candidate shot path; rc 0 = verified answer card
            local cand="$1" d1 d2
            d1=$(region_diff_pct /tmp/vvd-logs/shot-paused.png "$cand")
            d2=$(region_diff_pct /tmp/vvd-logs/shot-detail.png "$cand")
            log "  answer check [$cand]: vs-paused ${d1}% (want >=2 = something opened), vs-detail ${d2}% (want >=6 = not the Details screen)"
            [ "${d1:-0}" -ge 2 ] && [ "${d2:-0}" -ge 6 ]
          }
          answer_dwell() {  # $1=tag; shots at ~+1s/+2s/+3s after the ENTER; rc 0 = a dwell shot verified (copied to shot-answer)
            local tag="$1" s
            sleep 1; shot "answer-$tag-1"
            sleep 1; shot "answer-$tag-2"
            sleep 1; shot "answer-$tag-3"
            for s in 1 2 3; do
              if answer_ok "/tmp/vvd-logs/shot-answer-$tag-$s.png"; then
                cp "/tmp/vvd-logs/shot-answer-$tag-$s.png" /tmp/vvd-logs/shot-answer.png
                log "  answer card VERIFIED in dwell shot answer-$tag-$s; saved as shot-answer"
                return 0
              fi
            done
            return 1
          }
          # DISPATCH #27: guest-clock marker so the journal lines around
          # the answer ENTER can be aligned with this step's host log.
          log "guest clock before answer ENTER: $(timeout -k 5 15 vda -s "$SERIAL" shell date 2>/dev/null || echo unavailable)"
          key KEY_DOWN;      sleep 2    # focus question chip 1
          log "answer ENTER via remote-OK click (single delivery): xdotool click (1156,282)"
          xdotool mousemove 1156 282 click 1 2>/dev/null || true
          ANSWER=0
          if answer_dwell click; then ANSWER=1; fi
          if [ "$ANSWER" -ne 1 ]; then
            log "  remote-OK click produced no verified card; falling back to inputd KEY_ENTER once"
            key KEY_DOWN;  sleep 2
            key KEY_ENTER
            if answer_dwell key; then ANSWER=1; fi
          fi
          if [ "$ANSWER" -ne 1 ]; then
            echo "CHOREOGRAPHY FAILED: answer card never verified after chip ENTER (pause was verified; strengthened check rejects Details/black/no-change)"; exit 1
          fi
          # Hold so the take ENDS on the card: leave the app alone for
          # the remaining settle, then take an evidence shot. If the
          # post-answer exit still fired, shot-answer-late shows it;
          # the dwell-verified shot-answer above is the card regardless.
          sleep 7; shot answer-late
          LATE=$(region_diff_pct /tmp/vvd-logs/shot-answer.png /tmp/vvd-logs/shot-answer-late.png)
          log "  ending hold check: answer->late diff ${LATE}% (0-ish = take ends holding the card; large = post-answer exit still fired)"
          echo "CHOREOGRAPHY-DONE"

      - name: Stop capture
        if: always()
        run: |
          PID=$(cat /tmp/ffmpeg.pid 2>/dev/null || true)
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
            kill -INT "$PID" || true
            # wait for ffmpeg to finalize instead of a fixed sleep
            timeout 60 tail --pid="$PID" -f /dev/null || kill -9 "$PID" || true
          fi
          ls -la /tmp/demo_take1.mp4 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 /tmp/demo_take1.mp4 || true

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          SDK="$HOME/vega-sdk/0.24.12112"; D=/tmp/vvd-logs; mkdir -p "$D"
          { date -u; uptime; nproc; free -m; df -h /; \
            ps -eo pid,ppid,etimes,pcpu,pmem,stat,args --sort=-pcpu | head -40; } > "$D/host.txt" 2>&1
          timeout -k 5 15 vda devices -l > "$D/vda-devices-final.txt" 2>&1
          cp "$SDK"/logs/*.log "$D/" 2>/dev/null                    # CLI logs (silly level, every RUN: line)
          cp "$SDK/vvd/virtual_device.log" "$D/" 2>/dev/null        # Go launcher log (--log-path default)
          ( cd "$SDK/vvd" && find instances -maxdepth 2 -type f -size -5M \
              ! -name '*.qcow2' ! -name '*.img' -print0 | xargs -0 -r cp --parents -t "$D" ) 2>/dev/null
          cp /tmp/vda.*.log "$D/" 2>/dev/null                       # vda server log
          "$SDK/vvd/images/tv/vmtools/agent/emulator-check" accel > "$D/emulator-check-accel.txt" 2>&1
          DISPLAY=:99 xwininfo -root -tree > "$D/x11-tree.txt" 2>&1
          ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 "$D/shot-final.png"
          if [ -n "${SERIAL:-}" ]; then
            timeout -k 5 30 vda -s "$SERIAL" shell gwsi-tool-screenshooter /tmp/vvd-shot.png \
              && timeout -k 5 30 vda -s "$SERIAL" pull /tmp/vvd-shot.png "$D/shot-guest.png"
          fi
          # DISPATCH #27: post-hoc guest log dumps (ring-buffer fallback
          # for the live tails started in the choreography step). The
          # app console lines around the post-answer exit are the
          # evidence: '[Kepler] Key pressed: Back' (back event),
          # '[VideoHandler] - onEnded' (spurious ended), bare
          # '[PlayerScreen.kepler] - Navigating back' (Exit select),
          # '- Cleaning up video handler' alone (plain goBack).
          if [ -n "${SERIAL:-}" ]; then
            # DISPATCH #28: loggingctl replaces journalctl (see run 27).
            timeout -k 5 60 vda -s "$SERIAL" shell loggingctl log -o short_precise -v com.saxenawave.kidsdevotion \
              > "$D/guest-applog-dump.log" 2>&1 || true
            timeout -k 5 60 vda -s "$SERIAL" shell loggingctl log -o short_precise \
              | tail -n 3000 > "$D/guest-applog-dump-all.log" 2>&1 || true
            timeout -k 5 60 vda -s "$SERIAL" shell logcat -d -v time \
              > "$D/guest-logcat-dump.log" 2>&1 || true
            timeout -k 5 30 vda -s "$SERIAL" shell "ls -la /var/log/ 2>/dev/null; echo ---; tail -n 500 /var/log/messages 2>/dev/null; echo ---; dmesg 2>/dev/null | tail -n 200" \
              > "$D/guest-syslog-dump.txt" 2>&1 || true
          fi
          true

      - name: Upload demo take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-demo-take1
          path: /tmp/demo_take1.mp4
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-demo-logs
          path: |
            /tmp/vvd-start.log
            /tmp/ffmpeg.log
            /tmp/vvd-devices.txt
            /tmp/vvd-logs/
