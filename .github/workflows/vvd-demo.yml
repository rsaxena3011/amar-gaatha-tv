name: VVD Demo Capture
# Captures the C024 demo video: headless Vega Virtual Device on a GitHub
# Actions runner (/dev/kvm verified present), Xvfb + ffmpeg x11grab,
# scripted D-pad input via vda. Manual trigger only.
#
# PREREQ: the Vega SDK 0.24.12112 tarball must exist as split release
# assets under the SDK release tag (see competitions/c024-amazon/
# SDK_DELIVERY_RUNBOOK.md). Until then this workflow fails fast at the
# "Fetch Vega SDK" step with the exact missing piece named.
on:
  workflow_dispatch:
    inputs:
      sdk_release_tag:
        description: "Release tag holding the vega-sdk part-* assets"
        required: false
        default: "vega-sdk-0.24.12112"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: KVM gate (fail fast)
        run: |
          ls -l /dev/kvm || { echo "NO /dev/kvm on this runner"; exit 1; }
          kvm-ok || true

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg xz-utils curl > /dev/null 2>&1
          gh --version || true

      - name: Fetch Vega SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.sdk_release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "MISSING: release '$TAG' with vega-sdk part-* assets does not exist."; \
                 echo "Follow competitions/c024-amazon/SDK_DELIVERY_RUNBOOK.md, then re-dispatch."; exit 1; }
          mkdir -p /tmp/sdkdl "$HOME/vega-sdk"
          gh release download "$TAG" -p 'vega-sdk-part-*' -D /tmp/sdkdl
          cat /tmp/sdkdl/vega-sdk-part-* > /tmp/vega-sdk.tar.xz
          tar -xJf /tmp/vega-sdk.tar.xz -C "$HOME/vega-sdk"
          # Run 38621748159 died at boot: the tarball ships the PC's stale
          # vvd/instances/<uuid>/ state (hardware-qemu.ini, metadata) with
          # the PC install root /root/vega/sdk baked in. The Go
          # virtualdevice binary reuses that stale instance and fork/exec's
          # the emulator at the PC path; on the runner /root is not
          # traversable, so the launch dies with "permission denied" before
          # any device boots. Drop the stale instance state so
          # `virtual-device start` creates a fresh instance with
          # runner-local paths.
          rm -rf "$HOME/vega-sdk/0.24.12112/vvd/instances"
          # Run 38582760175 died at boot: the tarball lost the VVD
          # emulator's +x bit in transit ("Failed to launch:
          # fork/exec .../vvd/images/tv/vmtools/agent/emulator:
          # permission denied") while bin/ CLIs kept theirs. Restore
          # execute bits on the emulator and its qemu helpers after
          # extraction; without this the VVD can never boot.
          SDKROOT="$HOME/vega-sdk/0.24.12112"
          chmod +x "$SDKROOT/vvd/images/tv/vmtools/agent/emulator" 2>/dev/null || true
          find "$SDKROOT/vvd" -type f \( -name 'emulator*' -o -name 'qemu*' \) \
            -exec chmod +x {} + 2>/dev/null || true
          # The no-workspace SDK tarball ships no workspace/ tree at all, but
          # vega's import chain needs two things under it before vega
          # --version can run: (1) setup_packagelink_in_workspace symlinks
          # the repo into workspace/App, so the parent must exist; (2)
          # config.py's Dependencies init opens workspace/App/Config
          # (SKIP_LOCAL_CONFIG makes get_config_path return workspace/App
          # itself) and writes workspace/App/dependencies.pkl. The Config is
          # installer-shipped (vendored from the PC install as
          # demos/vega-workspace-App-Config); the tarball --exclude dropped
          # it along with the stale state (run 38466298288 died here).
          mkdir -p "$HOME/vega-sdk/0.24.12112/workspace/App"
          cp "$GITHUB_WORKSPACE/demos/vega-workspace-App-Config" \
             "$HOME/vega-sdk/0.24.12112/workspace/App/Config"
          export PATH="$HOME/vega-sdk/0.24.12112/bin:$PATH"
          vega --version
          ls "$HOME/vega-sdk/0.24.12112/bin" | head

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Boot VVD
        run: |
          export PATH="$HOME/vega-sdk/0.24.12112/bin:$PATH"
          export DISPLAY=:99
          # dutyfree-vega's config.py calls os.makedirs(workspace/env) with no
          # exist_ok: the old SDK tarball carried a stale workspace/env from
          # the PC-side attempts, which crashed the boot. With the
          # no-workspace tarball, env is created fresh on first use, but the
          # step still clears it defensively. workspace/App is KEPT: Fetch
          # restored the installer-shipped Config there (plus
          # dependencies.pkl and the repo symlink); only stale broken
          # symlinks are dropped. (rm -rf on the whole App dir broke every
          # vega command at import in run 38397839099.)
          rm -rf "$HOME/vega-sdk/0.24.12112/workspace/env"
          find "$HOME/vega-sdk/0.24.12112/workspace/App" -maxdepth 1 -xtype l -delete 2>/dev/null || true
          mkdir -p "$HOME/vega-sdk/0.24.12112/workspace/App"
          cp "$GITHUB_WORKSPACE/demos/vega-workspace-App-Config" \
             "$HOME/vega-sdk/0.24.12112/workspace/App/Config"
          # Run 38621748159 lesson: NEVER run two vega invocations
          # concurrently. config.py's create_symlink_farm has a TOCTOU
          # (exists-check then os.symlink with no exist_ok): the background
          # `virtual-device start` and the first wait-loop `vega device
          # list` raced it and the poll died with FileExistsError on a
          # Vodka symlink. Pre-build the farm SEQUENTIALLY here so the
          # background start and every later poll see it and skip creation.
          vega --version >/dev/null 2>&1
          vega virtual-device start > /tmp/vvd-start.log 2>&1 &
          echo "Waiting for VVD to register as a device (up to 15 min)..."
          for i in $(seq 1 90); do
            OUT=$(vega device list 2>&1 || true)
            # Fail loudly on a CLI crash (a Traceback once passed the old
            # grep as "device found" and faked a green boot in run
            # 38397839099).
            if echo "$OUT" | grep -qi "traceback"; then echo "vega crashed:"; echo "$OUT"; exit 1; fi
            # DEVICE-UP parsing (hardened 2026-10-14): banner lines must
            # never fake a device serial. Tier 1 accepts only adb-shaped
            # "<serial> <state>" lines; tier 2 accepts bare serial-shaped
            # tokens but rejects banner vocabulary, traceback words and
            # version-like tokens (e.g. "v0.24.12112" from a CLI banner).
            # Run 38582760175 lesson: a crashed "vega device list" prints
            # "VegaSDK Error: ERROR: ..." and tier 2 grabbed "VegaSDK" as
            # the serial, faking DEVICE-UP a third time. vegasdk/sdk/error
            # are now in the reject list in BOTH parse copies (Boot and
            # choreography).
            parse_serial() {
              local out="$1" serial
              serial=$(printf '%s\n' "$out" | grep -viE 'traceback' \
                | grep -Ei '^[[:space:]]*[A-Za-z0-9._:-]{4,}[[:space:]]+(device|offline|unauthorized|bootloader|recovery)[[:space:]]*$' \
                | sed -E 's/^[[:space:]]*([A-Za-z0-9._:-]{4,}).*/\1/' | head -1)
              if [ -z "$serial" ]; then
                serial=$(printf '%s\n' "$out" \
                  | grep -viE '^[[:space:]]*(list of devices attached|no devices.*)[[:space:]]*$|daemon|traceback' \
                  | grep -Eo '[A-Za-z0-9._:-]{4,}' \
                  | grep -viE '^(list|of|devices|attached|daemon|started|starting|now|tcp|vega|vegasdk|sdk|error|errors|device|adb|server|version|cli|file|line|most|recent|call|last)$' \
                  | grep -viE '^v?[0-9]+\.[0-9.]+$' | head -1)
              fi
              printf '%s' "$serial"
            }
            SERIAL=$(parse_serial "$OUT")
            [ -n "$SERIAL" ] && { echo "DEVICE-UP after ${i}x10s (serial: $SERIAL)"; echo "$OUT" > /tmp/vvd-devices.txt; break; }
            sleep 10
          done
          cat /tmp/vvd-devices.txt 2>/dev/null || { echo "VVD never registered:"; cat /tmp/vvd-start.log; exit 1; }
          grep -qi "traceback" /tmp/vvd-devices.txt && { echo "bogus device file:"; cat /tmp/vvd-devices.txt; exit 1; } || true

      - name: Start ffmpeg capture
        run: |
          nohup ffmpeg -y -f x11grab -video_size 1920x1080 -framerate 30 -i :99 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast /tmp/demo_take1.mp4 \
            > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid
          sleep 2
          kill -0 "$(cat /tmp/ffmpeg.pid)" && echo "ffmpeg recording"

      - name: Install + launch app, scripted D-pad choreography
        run: |
          export PATH="$HOME/vega-sdk/0.24.12112/bin:$PATH"
          export DISPLAY=:99
          # Same hardened serial parsing as the Boot VVD step: banner
          # lines must never fake a device serial.
          parse_serial() {
            local out="$1" serial
            serial=$(printf '%s\n' "$out" | grep -viE 'traceback' \
              | grep -Ei '^[[:space:]]*[A-Za-z0-9._:-]{4,}[[:space:]]+(device|offline|unauthorized|bootloader|recovery)[[:space:]]*$' \
              | sed -E 's/^[[:space:]]*([A-Za-z0-9._:-]{4,}).*/\1/' | head -1)
            if [ -z "$serial" ]; then
              serial=$(printf '%s\n' "$out" \
                | grep -viE '^[[:space:]]*(list of devices attached|no devices.*)[[:space:]]*$|daemon|traceback' \
                | grep -Eo '[A-Za-z0-9._:-]{4,}' \
                | grep -viE '^(list|of|devices|attached|daemon|started|starting|now|tcp|vega|vegasdk|sdk|error|errors|device|adb|server|version|cli|file|line|most|recent|call|last)$' \
                | grep -viE '^v?[0-9]+\.[0-9.]+$' | head -1)
            fi
            printf '%s' "$serial"
          }
          SERIAL=$(parse_serial "$(cat /tmp/vvd-devices.txt)")
          [ -n "$SERIAL" ] || { echo "no usable device id in vvd-devices.txt:"; cat /tmp/vvd-devices.txt; exit 1; }
          echo "Using device id: $SERIAL"
          # Install + launch Kids Devotion TV (package com.saxenawave.kidsdevotion)
          vega run-app "$GITHUB_WORKSPACE/demos/vega_x86_64.vpkg" com.saxenawave.kidsdevotion.main --deviceId "$SERIAL"
          sleep 12   # home screen render: "For Sharad Purnima: Kids Devotion" row, first card focused
          # Open first card (Achyutam Keshavam)
          vda -s "$SERIAL" shell input keyevent KEYCODE_DPAD_CENTER
          sleep 6    # player load
          # Pause -> Pause & Ask panel with chips appears
          vda -s "$SERIAL" shell input keyevent KEYCODE_MEDIA_PAUSE
          sleep 4    # hold on the paused panel
          # Open first question chip, hold on answer card
          vda -s "$SERIAL" shell input keyevent KEYCODE_DPAD_DOWN
          sleep 1
          vda -s "$SERIAL" shell input keyevent KEYCODE_DPAD_CENTER
          sleep 5    # answer card visible
          # Back to panel, resume playback
          vda -s "$SERIAL" shell input keyevent KEYCODE_BACK
          sleep 1
          vda -s "$SERIAL" shell input keyevent KEYCODE_MEDIA_PLAY
          sleep 5    # playing tail
          echo "CHOREOGRAPHY-DONE"

      - name: Stop capture
        if: always()
        run: |
          kill -INT "$(cat /tmp/ffmpeg.pid)" 2>/dev/null || true
          sleep 3
          ls -la /tmp/demo_take1.mp4 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 /tmp/demo_take1.mp4 || true

      - name: Upload demo take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-demo-take1
          path: /tmp/demo_take1.mp4
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-demo-logs
          path: |
            /tmp/vvd-start.log
            /tmp/ffmpeg.log
            /tmp/vvd-devices.txt
