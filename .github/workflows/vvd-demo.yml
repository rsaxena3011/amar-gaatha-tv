name: VVD Demo Capture
# Captures the C024 demo video: headless Vega Virtual Device on a GitHub
# Actions runner (/dev/kvm verified present), Xvfb + ffmpeg x11grab,
# scripted remote input via inputd-cli over vda. Manual trigger only.
#
# PREREQ: the Vega SDK 0.24.12112 tarball must exist as split release
# assets under the SDK release tag (see competitions/c024-amazon/
# SDK_DELIVERY_RUNBOOK.md). Until then this workflow fails fast at the
# "Fetch Vega SDK" step with the exact missing piece named.
on:
  workflow_dispatch:
    inputs:
      sdk_release_tag:
        description: "Release tag holding the vega-sdk part-* assets"
        required: false
        default: "vega-sdk-0.24.12112-noworkspace"

jobs:
  demo:
    runs-on: ubuntu-24.04
    # Worst case with the dispatch-#9 retry path: fetch ~4 + boot 30 +
    # choreography 45 (3 install attempts + raw fallback) + capture ~4.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: KVM gate (fail fast)
        run: |
          ls -l /dev/kvm || { echo "NO /dev/kvm on this runner"; exit 1; }
          # Standard GitHub-runner recipe: make /dev/kvm usable by the runner
          # user (the emulator hard-fails "x86_64 emulation currently requires
          # hardware acceleration!" without it; it never falls back to TCG).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          # /dev/kvm existing is not enough: prove the runner user can
          # actually use the KVM API, or the emulator boots degraded and
          # VDA can never connect ("ready" but invisible).
          python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); v=fcntl.ioctl(fd,0xAE00); print("KVM API version",v); assert v>=12'

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg xz-utils curl x11-utils > /dev/null 2>&1
          gh --version || true

      - name: Fetch Vega SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.sdk_release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "MISSING: release '$TAG' with vega-sdk part-* assets does not exist."; \
                 echo "Follow competitions/c024-amazon/SDK_DELIVERY_RUNBOOK.md, then re-dispatch."; exit 1; }
          mkdir -p /tmp/sdkdl "$HOME/vega-sdk"
          gh release download "$TAG" -p 'vega-sdk-part-*' -D /tmp/sdkdl
          cat /tmp/sdkdl/vega-sdk-part-* > /tmp/vega-sdk.tar.xz
          tar -xJf /tmp/vega-sdk.tar.xz -C "$HOME/vega-sdk"
          # Run 38621748159 died at boot: the tarball ships the PC's stale
          # vvd/instances/<uuid>/ state (hardware-qemu.ini, metadata) with
          # the PC install root /root/vega/sdk baked in. The Go
          # virtualdevice binary reuses that stale instance and fork/exec's
          # the emulator at the PC path; on the runner /root is not
          # traversable, so the launch dies with "permission denied" before
          # any device boots. Drop the stale instance state so
          # `virtual-device start` creates a fresh instance with
          # runner-local paths.
          rm -rf "$HOME/vega-sdk/0.24.12112/vvd/instances"
          # Run 38582760175 died at boot: the tarball lost the VVD
          # emulator's +x bit in transit ("Failed to launch:
          # fork/exec .../vvd/images/tv/vmtools/agent/emulator:
          # permission denied") while bin/ CLIs kept theirs. Restore
          # execute bits on the emulator and its qemu helpers after
          # extraction; without this the VVD can never boot.
          SDKROOT="$HOME/vega-sdk/0.24.12112"
          chmod +x "$SDKROOT/vvd/images/tv/vmtools/agent/emulator" 2>/dev/null || true
          find "$SDKROOT/vvd" -type f \( -name 'emulator*' -o -name 'qemu*' \) \
            -exec chmod +x {} + 2>/dev/null || true
          # The no-workspace SDK tarball ships no workspace/ tree at all, but
          # vega's import chain needs two things under it before vega
          # --version can run: (1) setup_packagelink_in_workspace symlinks
          # the repo into workspace/App, so the parent must exist; (2)
          # config.py's Dependencies init opens workspace/App/Config
          # (SKIP_LOCAL_CONFIG makes get_config_path return workspace/App
          # itself) and writes workspace/App/dependencies.pkl. The Config is
          # installer-shipped (vendored from the PC install as
          # demos/vega-workspace-App-Config); the tarball --exclude dropped
          # it along with the stale state (run 38466298288 died here).
          mkdir -p "$HOME/vega-sdk/0.24.12112/workspace/App"
          cp "$GITHUB_WORKSPACE/demos/vega-workspace-App-Config" \
             "$HOME/vega-sdk/0.24.12112/workspace/App/Config"
          # Run 38716808541 died at boot: the Boot step's background
          # `vega virtual-device start` and the first `vega device list`
          # poll race into config.py's create_symlink_farm (every vega
          # invocation rebuilds the farm at import); the loser's
          # exists-check-then-os.symlink dies with FileExistsError
          # (TOCTOU on the kepler-notices link), and a sibling interleave
          # can fake the "not pure symlink farm" exit(1). The patch script
          # converts every leaf create in config.py to create-first-then-
          # verify (EAFP); both racers build the identical farm, so the
          # race is harmless (verified: 10 threads x 30 iters, 0 crashes,
          # farms identical, single-process semantics preserved).
          # Runner-local only; the PC SDK and the release tarball are
          # untouched. Must run BEFORE the first vega invocation below.
          python3 "$GITHUB_WORKSPACE/demos/sdk_toctou_patch.py" \
            "$HOME/vega-sdk/0.24.12112/tools/bin/config.py"
          export PATH="$HOME/vega-sdk/0.24.12112/bin:$PATH"
          vega --version
          ls "$HOME/vega-sdk/0.24.12112/bin" | head
          # Restore +x on ALL ELF binaries and shebang scripts in the SDK
          # tree. The tarball transit can strip exec bits; when vvd creates
          # a fresh instance it shells out to helpers (qemu-img, mkscard,
          # vda, crashpad_handler) to build userdata.qcow2/cache.ext4, and a
          # missing +x there fails silently mid-boot.
          # NOTE (dispatch #8, 2026-10-16): -d '\n' is REQUIRED. The
          # no-workspace tarball ships filenames with spaces
          # (e.g. "... (dev).tmpl"); bare xargs splits them on whitespace,
          # chmod exits 123 on the phantom tokens, and set -e kills the
          # step before VVD ever boots. GNU xargs supports -d.
          find "$SDKROOT" -type f -exec file {} + 2>/dev/null | \
            grep -E 'ELF|executable|script' | cut -d: -f1 | xargs -r -d '\n' chmod +x
          # Make the REAL vda (SDK's KeplerCLIVegaDeviceAdaptor dispatcher ->
          # x86_64-Linux/bin/vda, the same binary vega uses) and vega visible
          # to every later step. $SDK/bin alone has no vda, so the old
          # choreography's bare `vda ...` was "command not found".
          VDA_DIR=$(dirname "$(ls "$SDKROOT"/packages/KeplerCLIVegaDeviceAdaptor/*/AL2_x86_64/DEV.STD.PTHREAD/build/bin/vda | head -1)")
          "$VDA_DIR/vda" version
          echo "$SDKROOT/bin" >> "$GITHUB_PATH"
          echo "$VDA_DIR" >> "$GITHUB_PATH"

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Boot VVD
        timeout-minutes: 30
        run: |
          SDK="$HOME/vega-sdk/0.24.12112"
          export DISPLAY=:99
          mkdir -p /tmp/vvd-logs
          # dutyfree-vega's config.py calls os.makedirs(workspace/env) with no
          # exist_ok: clear env defensively; KEEP workspace/App (Config +
          # dependencies.pkl + repo symlink), only drop stale broken symlinks.
          # (rm -rf on the whole App dir broke every vega command at import in
          # run 38397839099.)
          rm -rf "$SDK/workspace/env"
          find "$SDK/workspace/App" -maxdepth 1 -xtype l -delete 2>/dev/null || true
          mkdir -p "$SDK/workspace/App"
          cp "$GITHUB_WORKSPACE/demos/vega-workspace-App-Config" "$SDK/workspace/App/Config"

          # Helpers shared with later steps (sourced again there).
          cat > /tmp/vvd-lib.sh <<'LIB'
          ts()  { date -u +%H:%M:%S; }
          log() { printf '[%s] %s\n' "$(ts)" "$*" | tee -a /tmp/vvd-logs/boot-poll.log; }
          # Readiness = the SDK Go launcher's own checkShell contract
          # (`uname -a` says amazon AND hardware-name is vvrp), but every call
          # is time-boxed: vda/adb shell has no timeout of its own.
          vvd_probe() {
            local un hw
            un=$(timeout -k 5 20 vda -s "$1" shell uname -a 2>&1) || { log "  uname rc!=0: $un"; return 1; }
            hw=$(timeout -k 5 20 vda -s "$1" shell vdcm get com.amazon.devconf/system/device-info/hardware-name 2>&1) || { log "  vdcm rc!=0: $hw"; return 1; }
            log "  uname: $un | hw: $hw"
            printf '%s' "$un" | grep -qi amazon && printf '%s' "$hw" | grep -qi vvrp
          }
          # Wall-clock deadline (not an iteration count); logs every poll.
          vvd_wait_ready() {
            local budget=$1 deadline=$(( $(date +%s) + $1 )) i=0 devs state
            while :; do
              i=$((i+1))
              devs=$(timeout -k 5 15 vda devices 2>&1) || true
              SERIAL=$(printf '%s\n' "$devs" | awk '$1 ~ /^emulator-[0-9]+$/ {print $1; exit}')
              state=$(printf '%s\n' "$devs" | awk '$1 ~ /^emulator-[0-9]+$/ {print $2; exit}')
              log "poll #$i: $(printf '%s' "$devs" | tail -n +2 | tr '\t\n' ' ;')"
              if [ -n "$SERIAL" ] && [ "$state" = device ] && vvd_probe "$SERIAL"; then
                log "READY $SERIAL (poll #$i)"; return 0
              fi
              if [ "$state" = offline ] && [ $((i % 6)) -eq 0 ]; then
                log "  offline for a while -> vda reconnect offline"
                timeout -k 5 15 vda reconnect offline > /dev/null 2>&1 || true
              fi
              [ "$state" = unauthorized ] && log "  unauthorized: ~/.android/adbkey.pub did not reach the guest"
              # The SDK launcher kills the emulator when its own budget expires.
              if grep -q 'LAUNCHER-EXIT' /tmp/vvd-start.log 2>/dev/null \
                 && ! grep -q 'Virtual device ready' /tmp/vvd-start.log; then
                log "launcher exited without 'Virtual device ready'"; return 1
              fi
              [ "$(date +%s)" -ge "$deadline" ] && { log "NOT READY after ${budget}s"; return 1; }
              sleep 10
            done
          }
          LIB
          . /tmp/vvd-lib.sh

          # 1) Sequential pre-launch: the first `vega device list` builds the
          #    symlink farm (`vega --version` exits before
          #    setup_runtime_environment and never built it), and one
          #    persistent vda server on tcp:5037 is started, generating
          #    ~/.android/adbkey BEFORE the emulator pushes adbkey.pub.
          timeout -k 5 180 vega device list > /tmp/vvd-logs/prelaunch-device-list.txt 2>&1 || true
          timeout -k 5 30 vda start-server 2>&1 | tee -a /tmp/vvd-logs/boot-poll.log || true
          ls -l ~/.android/ 2>&1 | tee -a /tmp/vvd-logs/boot-poll.log || true

          # 2) Launch. Keep the SDK's own boot budget (run 38722681803 fix);
          #    timestamp every line and record the exit (the Node wrapper
          #    swallows the Go launcher's status). Do NOT pass --vda-port=5037:
          #    --vda-port is the emulator's device-side port (5555, serial
          #    emulator-5554), not the vda server port, and the Node CLI does
          #    not forward it anyway.
          #    Do NOT pass --no-gl-accel: it maps to the emulator's -gpu off,
          #    which disables ALL guest rendering (runs 9+10: black guest
          #    screen, demo video would be a black rectangle). The runner has
          #    no GPU, so the AVD's own hw.gpu.mode=swiftshader_indirect
          #    (CPU rendering) is what we want; omitting the flag lets the
          #    emulator honor its config.
          ( vega virtual-device start --timeout 900 2>&1; echo "LAUNCHER-EXIT rc=$?" ) \
            | while IFS= read -r l || [ -n "$l" ]; do printf '%s %s\n' "$(date -u +%T)" "$l"; done > /tmp/vvd-start.log &

          # 3) Wait on vda directly (never `vega device list`: it runs an
          #    un-time-boxed per-device shell chain; run 7 froze inside it).
          if ! vvd_wait_ready 1080; then
            echo "VVD never became ready:"; cat /tmp/vvd-start.log; exit 1
          fi
          ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 /tmp/vvd-logs/shot-boot-ready.png || true

          # 4) Evidence for the run-7 question (never gates the job): one raw,
          #    time-boxed `vega device list`, plus each piece of its
          #    GET_DEVICE_INFO chain run separately with rc + duration.
          {
            echo "== vda devices -l"; timeout -k 5 15 vda devices -l
            echo "== raw vega device list"; s=$(date +%s)
            timeout -k 5 90 vega device list; echo "rc=$? after $(( $(date +%s) - s ))s"
            echo "== GET_DEVICE_INFO pieces"
            for c in "vdcm get com.amazon.devconf/system/device-info/device-type-id" "uname -m" \
                     "vdcm get com.amazon.devconf/system/device-info/profile" "uname -n" \
                     "vsm developer-mode" "vdcm get com.amazon.devconf/system/device-info/product-name" \
                     "vdcm get com.amazon.devconf/system/device-info/build-desc" "whoami"; do
              s=$(date +%s); o=$(timeout -k 5 30 vda -s "$SERIAL" shell "$c" 2>&1); r=$?
              echo "[$c] rc=$r $(( $(date +%s) - s ))s :: $o"
            done
          } > /tmp/vvd-logs/device-diag.txt 2>&1 || true

          # 5) inputd-cli button_press needs developer mode on VVD (default
          #    shell only exposes get_* commands); enabling it reboots the VVD.
          dm=$(timeout -k 5 30 vda -s "$SERIAL" shell vsm developer-mode 2>&1) || true
          log "developer-mode: $dm"
          if ! printf '%s' "$dm" | grep -q enable; then
            timeout -k 5 60 vda -s "$SERIAL" shell vsm developer-mode enable 2>&1 | tee -a /tmp/vvd-logs/boot-poll.log || true
            for _ in $(seq 1 18); do   # wait (<=3 min) for the reboot to drop the transport
              timeout -k 5 15 vda -s "$SERIAL" shell true > /dev/null 2>&1 || break
              sleep 10
            done
            vvd_wait_ready 600 || { echo "VVD did not come back after developer-mode enable"; exit 1; }
            sleep 20   # let the launcher/home UI settle after the reboot
          fi
          timeout -k 5 30 vda -s "$SERIAL" shell inputd-cli --help 2>&1 | tee /tmp/vvd-logs/inputd-help.txt || true
          grep -q button_press /tmp/vvd-logs/inputd-help.txt || { echo "inputd-cli button_press unavailable"; exit 1; }

          { echo "$SERIAL"; timeout -k 5 15 vda devices -l; } > /tmp/vvd-devices.txt 2>&1 || true
          echo "SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Start ffmpeg capture
        run: |
          # Fragmented MP4 stays playable even if ffmpeg is killed; no cursor.
          nohup ffmpeg -y -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -movflags +frag_keyframe+empty_moov \
            /tmp/demo_take1.mp4 > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid
          sleep 2
          kill -0 "$(cat /tmp/ffmpeg.pid)" && echo "ffmpeg recording"

      - name: Install + launch app, scripted remote choreography
        # Dispatch #9 (run 38901912099, 2026-10-16): the boot readiness gate
        # (uname + hardware-name) passed on a partially-initialized guest
        # (black screen, nested-virtualization warning, flapping vdad
        # transport). `vega run-app` then died in its GET_DEVICE_INFO
        # discovery chain ("No permission for operation", exit 254) and the
        # transport went offline. The install phase now: (1) gates on a
        # settled guest, (2) retries 3x with transport recycle, (3) falls
        # back to raw vda primitives that bypass the Node CLI discovery.
        timeout-minutes: 45
        run: |
          . /tmp/vvd-lib.sh
          export DISPLAY=:99
          [ -n "${SERIAL:-}" ] || { echo "no SERIAL exported by Boot VVD"; exit 1; }
          echo "Using device id: $SERIAL"
          shot() { ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 "/tmp/vvd-logs/shot-$1.png" || true; }
          # Vega OS has no Android `input keyevent`; remote keys go through
          # inputd-cli with Linux key codes (KEY_ENTER = Select, KEY_DOWN,
          # KEY_PLAYPAUSE = the app's SupportedKeys.PlayPause toggle).
          # NOTE: KEY_BACK is deliberately NOT pressed. Verified in
          # PlayerScreen.vega.tsx: SupportedKeys.Back and hardwareBackPress
          # both route to navigateBack(), which destroys the video elements
          # and calls navigation.goBack(). Back does not dismiss the answer
          # card; it kills the player. The take ends on the answer card.
          key() {
            local out
            log "key $1"
            out=$(timeout -k 5 20 vda -s "$SERIAL" shell inputd-cli button_press "$1" 2>&1) || { log "  failed: $out"; return 1; }
            if printf '%s' "$out" | grep -qi 'did not match'; then log "  rejected: $out"; return 1; fi
          }

          # --- FIX #1 (dispatch #9 post-mortem, hardened run 11): gate the
          # install on a settled guest. Run 11 proved the transport flaps on
          # nested virt (vdad dropped exactly during probe 1, reconnected 1s
          # later), so each probe is tolerant: 5 tries, 10s apart, instead of
          # fail-fast. Then a non-black guest screen pixel check.
          tolerant_probe() {
            local t
            for t in 1 2 3 4 5; do
              timeout -k 5 30 vda -s "$SERIAL" shell true >/dev/null 2>&1 && return 0
              log "  probe try $t/5 failed; waiting for transport"
              sleep 10
            done
            return 1
          }
          preinstall_gate() {
            log "pre-install gate: 3 tolerant shell probes"
            local i
            for i in 1 2 3; do
              tolerant_probe || { log "  probe $i/3 FAILED after 5 tries"; return 1; }
              log "  probe $i/3 ok"
              if [ "$i" -lt 3 ]; then sleep 20; fi
            done
            shot preinstall-gate
            # Guest screen is the emulator window's child at 962x540+100+100
            # (run 10 x11-tree.txt). A black guest crops to ~20KB PNG; a
            # rendered TV UI is far larger. (ffmpeg signalstats prints no
            # per-frame stats on modern ffmpeg, so no text parsing; PNG byte
            # size of the guest-region crop is the signal.)
            local crop_bytes
            ffmpeg -loglevel error -y -i /tmp/vvd-logs/shot-preinstall-gate.png \
              -vf "crop=962:540:100:100" -frames:v 1 /tmp/vvd-logs/guest-crop.png \
              || { log "  guest crop failed"; return 1; }
            crop_bytes=$(wc -c < /tmp/vvd-logs/guest-crop.png | tr -d ' ')
            log "  guest-region crop PNG bytes=$crop_bytes"
            [ "$crop_bytes" -gt 60000 ] \
              || { log "  SCREEN IS BLACK: guest UI never rendered"; return 1; }
            log "pre-install gate PASSED"
          }

          # --- FIX #2 (dispatch #9 post-mortem): 3 install attempts with
          # backoff; recycle the vda transport between attempts (in #9 the
          # transport went offline after the failed install and never came
          # back on its own).
          try_install_cli() {
            timeout -k 10 300 vega run-app "$GITHUB_WORKSPACE/demos/vega_x86_64.vpkg" \
              com.saxenawave.kidsdevotion.main --deviceId "$SERIAL"
          }
          recycle_vda() {
            log "recycling vda transport"
            vda kill-server >/dev/null 2>&1 || true
            sleep 5
            timeout -k 5 30 vda start-server >/dev/null 2>&1 || true
            sleep 10
          }
          # Run 11: with software rendering the guest needs a minute for the
          # boot animation/UI to settle before the gate probes it.
          log "settle 45s for software-rendered boot"
          sleep 45
          preinstall_gate || { echo "PRE-INSTALL GATE FAILED: guest never settled (see shot-preinstall-gate.png in the logs artifact)"; exit 1; }
          install_ok=0
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            log "== install attempt $attempt/3 (Node CLI path)"
            rc=0
            try_install_cli || rc=$?
            if [ "$rc" -eq 0 ]; then log "install SUCCEEDED via Node CLI"; install_ok=1; break; fi
            log "install attempt $attempt FAILED (rc=$rc)"
            recycle_vda
            vvd_wait_ready 300 || { echo "device did not come back after transport recycle"; exit 1; }
            preinstall_gate || { echo "pre-install gate failed on retry $attempt"; exit 1; }
            sleep 10
          done

          # --- FIX #3 (dispatch #9 post-mortem): if the Node CLI path fails
          # all 3 attempts, bypass its GET_DEVICE_INFO discovery chain (the
          # exit-254 "No permission for operation" failure in #9) with raw
          # vda primitives: push + guest-side vpm install, then launch via
          # vmsgr (primitives from the merged 5-model review).
          if [ "$install_ok" -ne 1 ]; then
            log "Node CLI path failed 3x; trying RAW fallback"
            timeout -k 10 300 vda -s "$SERIAL" push "$GITHUB_WORKSPACE/demos/vega_x86_64.vpkg" /data/local/tmp/take1.vpkg \
              || { echo "raw fallback: vda push failed"; exit 1; }
            log "push ok; guest vpm install"
            timeout -k 5 300 vda -s "$SERIAL" shell vpm install /data/local/tmp/take1.vpkg \
              || { echo "raw fallback: vpm install failed"; exit 1; }
            log "vpm install ok; launching via vmsgr"
            timeout -k 5 60 vda -s "$SERIAL" shell vmsgr send pkg://com.saxenawave.kidsdevotion.main \
              || { echo "raw fallback: vmsgr launch failed"; exit 1; }
            log "RAW FALLBACK install+launch SUCCEEDED"
          fi

          # Run 12: the app takes 30s+ to paint after install; the key
          # sequence started while it was still loading, so the Pause & Ask
          # moment never landed on camera. Give it a full minute, then
          # confirm the guest is actually showing something before keys.
          # Run 14: blind keys are unreliable on nested virt (the app is
          # slow; a key can land before the screen settles). After each
          # navigation key, wait up to 30s for the screenshot to actually
          # change; if it never changes, try the key once more before
          # giving up on the step.
          key_wait_change() {  # $1=key $2=shot-name $3=prev-shot-path
            key "$1" || return 1
            local i
            for i in 1 2 3 4 5 6; do
              sleep 5
              shot "$2"
              if ! cmp -s "/tmp/vvd-logs/shot-$2.png" "$3"; then
                log "  screen changed after $1 (waited $((i*5))s)"
                return 0
              fi
            done
            log "  screen did NOT change after $1 (30s)"
            return 1
          }
          log "settle 60s for app first paint"
          sleep 60; shot app-settled
          sleep 12; shot home      # Home: drawer open, first card row visible
          # Home -> Details: ENTER (if the drawer stole focus, this closes
          # it; retry once if the screen never changes).
          key_wait_change KEY_ENTER detail /tmp/vvd-logs/shot-home.png \
            || key_wait_change KEY_ENTER detail-retry /tmp/vvd-logs/shot-detail.png \
            || { echo "never reached Details"; exit 1; }
          # Details -> Player: Watch now has DefaultFocus.
          key_wait_change KEY_ENTER player /tmp/vvd-logs/shot-detail.png \
            || key_wait_change KEY_ENTER player-retry /tmp/vvd-logs/shot-player.png \
            || { echo "never reached Player"; exit 1; }
          key KEY_PLAYPAUSE; sleep 8; shot paused   # Pause -> Pause & Ask panel
          key KEY_DOWN;      sleep 2
          key KEY_ENTER;     sleep 10; shot answer   # question chip -> answer card (take ends here)
          echo "CHOREOGRAPHY-DONE"

      - name: Stop capture
        if: always()
        run: |
          PID=$(cat /tmp/ffmpeg.pid 2>/dev/null || true)
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
            kill -INT "$PID" || true
            # wait for ffmpeg to finalize instead of a fixed sleep
            timeout 60 tail --pid="$PID" -f /dev/null || kill -9 "$PID" || true
          fi
          ls -la /tmp/demo_take1.mp4 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 /tmp/demo_take1.mp4 || true

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          SDK="$HOME/vega-sdk/0.24.12112"; D=/tmp/vvd-logs; mkdir -p "$D"
          { date -u; uptime; nproc; free -m; df -h /; \
            ps -eo pid,ppid,etimes,pcpu,pmem,stat,args --sort=-pcpu | head -40; } > "$D/host.txt" 2>&1
          timeout -k 5 15 vda devices -l > "$D/vda-devices-final.txt" 2>&1
          cp "$SDK"/logs/*.log "$D/" 2>/dev/null                    # CLI logs (silly level, every RUN: line)
          cp "$SDK/vvd/virtual_device.log" "$D/" 2>/dev/null        # Go launcher log (--log-path default)
          ( cd "$SDK/vvd" && find instances -maxdepth 2 -type f -size -5M \
              ! -name '*.qcow2' ! -name '*.img' -print0 | xargs -0 -r cp --parents -t "$D" ) 2>/dev/null
          cp /tmp/vda.*.log "$D/" 2>/dev/null                       # vda server log
          "$SDK/vvd/images/tv/vmtools/agent/emulator-check" accel > "$D/emulator-check-accel.txt" 2>&1
          DISPLAY=:99 xwininfo -root -tree > "$D/x11-tree.txt" 2>&1
          ffmpeg -loglevel error -y -f x11grab -video_size 1920x1080 -i :99 -frames:v 1 "$D/shot-final.png"
          if [ -n "${SERIAL:-}" ]; then
            timeout -k 5 30 vda -s "$SERIAL" shell gwsi-tool-screenshooter /tmp/vvd-shot.png \
              && timeout -k 5 30 vda -s "$SERIAL" pull /tmp/vvd-shot.png "$D/shot-guest.png"
          fi
          true

      - name: Upload demo take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-demo-take1
          path: /tmp/demo_take1.mp4
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-demo-logs
          path: |
            /tmp/vvd-start.log
            /tmp/ffmpeg.log
            /tmp/vvd-devices.txt
            /tmp/vvd-logs/
